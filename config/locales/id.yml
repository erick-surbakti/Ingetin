id:
  activerecord:
    errors:
      messages:
        record_invalid: "Validasi gagal: %{errors}"
        restrict_dependent_destroy:
          has_one: "Tidak bisa dihapus karena masih memiliki %{record} terkait"
          has_many: "Tidak bisa dihapus karena masih memiliki %{record} terkait"
    models:
      user: "Pemilik kos"
    attributes:
      user:
        name: "Nama"
        email_address: "Email"
        password: "Kata sandi"
        password_confirmation: "Konfirmasi kata sandi"

  errors:
    format: "%{attribute} %{message}"
    messages:
      accepted: "harus disetujui"
      blank: "tidak boleh kosong"
      confirmation: "tidak cocok dengan %{attribute}"
      empty: "tidak boleh kosong"
      equal_to: "harus sama dengan %{count}"
      even: "harus genap"
      exclusion: "sudah dipakai"
      greater_than: "harus lebih besar dari %{count}"
      greater_than_or_equal_to: "harus lebih besar atau sama dengan %{count}"
      in: "harus di antara %{count}"
      inclusion: "tidak termasuk pilihan yang tersedia"
      invalid: "tidak valid"
      less_than: "harus lebih kecil dari %{count}"
      less_than_or_equal_to: "harus lebih kecil atau sama dengan %{count}"
      model_invalid: "Validasi gagal: %{errors}"
      not_a_number: "harus berupa angka"
      not_an_integer: "harus bilangan bulat"
      odd: "harus ganjil"
      other_than: "tidak boleh sama dengan %{count}"
      password_too_long: "terlalu panjang"
      present: "harus kosong"
      required: "harus diisi"
      taken: "sudah dipakai"
      too_long: "terlalu panjang (maksimal %{count} karakter)"
      too_short: "terlalu pendek (minimal %{count} karakter)"
      wrong_length: "panjangnya harus %{count} karakter"

  helpers:
    select:
      prompt: "Pilih"
    submit:
      create: "Simpan"
      update: "Simpan perubahan"
      submit: "Simpan"

  date:
    abbr_day_names: [Min, Sen, Sel, Rab, Kam, Jum, Sab]
    abbr_month_names: [~, Jan, Feb, Mar, Apr, Mei, Jun, Jul, Agu, Sep, Okt, Nov, Des]
    day_names: [Minggu, Senin, Selasa, Rabu, Kamis, Jumat, Sabtu]
    month_names: [~, Januari, Februari, Maret, April, Mei, Juni, Juli, Agustus, September, Oktober, November, Desember]
    formats:
      default: "%d-%m-%Y"
      short: "%-d %b"
      long: "%-d %B %Y"
      month: "%B %Y"
    order:
      - :day
      - :month
      - :year

  time:
    am: "AM"
    pm: "PM"
    formats:
      default: "%-d %B %Y %H:%M"
      short: "%-d %b %H:%M"
      long: "%-d %B %Y, %H:%M WIB"

  number:
    format:
      delimiter: "."
      separator: ","
      precision: 0
      significant: false
      strip_insignificant_zeros: false
    currency:
      format:
        unit: "Rp"
        format: "%u%n"
        negative_format: "-%u%n"
        delimiter: "."
        separator: ","
        precision: 0
        significant: false
        strip_insignificant_zeros: false

  support:
    array:
      words_connector: ", "
      two_words_connector: " dan "
      last_word_connector: ", dan "
