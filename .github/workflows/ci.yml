name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lewati job Ruby selama aplikasi Rails belum ada (repo masih tahap fondasi).
  detect:
    runs-on: ubuntu-latest
    outputs:
      has_app: ${{ steps.check.outputs.has_app }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ -f Gemfile ]; then
            echo "has_app=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_app=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Gemfile belum ada, job Ruby dilewati."
          fi

  lint:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github

  security:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: bin/brakeman --no-pager
      - name: Importmap audit
        if: hashFiles('bin/importmap') != ''
        run: bin/importmap audit

  test:
    needs: detect
    if: needs.detect.outputs.has_app == 'true'
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v7
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsqlite3-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Test
        run: bin/rails db:test:prepare test
