name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: RuboCop
        run: bin/rubocop -f github

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Brakeman
        run: .github/scripts/report "Brakeman" bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error
      - name: Bundler audit
        run: .github/scripts/report "Bundler audit" bin/bundler-audit
      - name: Importmap audit
        run: .github/scripts/report "Importmap audit" bin/importmap audit

  test:
    runs-on: ubuntu-latest
    env:
      RAILS_ENV: test
      TZ: Asia/Jakarta
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libsqlite3-dev
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Migrasi dari nol cocok dengan db/schema.rb
        run: .github/scripts/report "Schema" bash -c 'bin/rails db:migrate && git diff --exit-code db/schema.rb'
      - name: Test
        run: .github/scripts/report "Test" bin/rails test
      - name: Seeds
        run: .github/scripts/report "Seeds" bin/rails db:seed:replant
