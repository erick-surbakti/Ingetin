version: 2
updates:
  - package-ecosystem: bundler
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
    open-pull-requests-limit: 5
    groups:
      rails:
        patterns: ["rails", "action*", "active*", "railties"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      timezone: Asia/Jakarta
